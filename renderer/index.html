<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net">
    <title>OptiScaler Manager</title>
</head>
<body>
    <div id="app">


        <!-- Titlebar customizada-->
         <div id="titlebar">
            <div class="win-btns">
                <button id="wb wb-close" onclick="window.api.close()"></button>
                <button id="wb wb-min" onclick="window.api.minimize()"></button>
                <button id="wb wb-max" onclick="window.api.maximize()"></button>
            </div>

            <span class="tb-title">OptiScaler Manager</span>
         </div>

        <!-- Topbar -->
         <div class="topbar">
            <!-- nav, busca e ações vão aqui — igual ao protótipo -->

         </div>

        <!-- Conteúdo -->
         <div class="content" id="content">
            <!-- nav, busca e ações vão aqui — igual ao protótipo -->

         </div>


    </div>
    
</body>
</html>
